# Gruvbox Starship prompt without helper scripts.
#
# Layout:
#   line 1: OS + user | directory | Git | toolchain/project | Docker
#   line 2: time + duration/status
#   line 3: input symbol
#
# A Nerd Font is required for the Powerline separators and icons.
#
# Colour model:
# Line 1 opens with an opaque orange identity block and then runs on one
# constant bg1 field. Every optional group brings its own accent-coloured
# separator and accent-coloured text on that field, so a group can be absent
# without leaving a seam behind. Pure Starship cannot tell which differently
# coloured optional segment was the previous visible one, which is exactly why
# the field colour stays put instead of forming a chain.
#
# bashrc.d/prompt-gruvbox.sh renders the same prompt in pure Bash. It tracks
# the previous background itself and can therefore chain colours, so keep the
# two palettes in sync rather than the segment backgrounds.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = 'gruvbox'
scan_timeout = 30
command_timeout = 1000

format = """
[](fg:orange)\
$os\
$username\
[](fg:orange bg:bg1)\
$directory\
([](fg:aqua bg:bg1)$git_branch$git_commit$git_status)\
([](fg:blue_bright bg:bg1)$java$package$nodejs$python)\
([](fg:bg3 bg:bg1)$docker_context)\
[](fg:bg1)\
$line_break\
[](fg:bg1)\
$time\
$cmd_duration\
$status\
[](fg:bg1)\
$line_break\
$character"""

[palettes.gruvbox]
fg0 = '#fbf1c7'
bg1 = '#3c3836'
bg3 = '#665c54'
blue = '#458588'
blue_bright = '#83a598'
aqua = '#689d6a'
green = '#98971a'
orange = '#d65d0e'
purple = '#b16286'
red = '#cc241d'
yellow = '#d79921'

# --- line 1: identity / path ----------------------------------------------

[os]
disabled = false
format = '[ $symbol ](fg:fg0 bg:orange)'

[os.symbols]
Windows = '󰍲'
Linux = '󰌽'
Macos = '󰀵'

[username]
show_always = true
format = '[$user ](fg:fg0 bg:orange)'

[directory]
format = '[ $path ](fg:yellow bg:bg1)'
home_symbol = '~'
truncation_length = 3
truncation_symbol = '.../'
truncate_to_repo = false
read_only = ''

# --- line 1: Git -----------------------------------------------------------

[git_branch]
only_attached = true
symbol = ' '
format = '[ $symbol$branch](fg:aqua bg:bg1)'

[git_commit]
only_detached = true
commit_hash_length = 7
tag_disabled = true
format = '[  $hash](fg:aqua bg:bg1)'

[git_status]
format = '[$conflicted$staged$modified$renamed$deleted$typechanged$untracked$stashed$ahead_behind ](fg:aqua bg:bg1)'
conflicted = ' =${count}'
staged = ' +${count}'
modified = ' !${count}'
renamed = ' +${count}'
deleted = ' !${count}'
typechanged = ' !${count}'
untracked = ' ?${count}'
stashed = ' *${count}'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇡${ahead_count} ⇣${behind_count}'
up_to_date = ''
ignore_submodules = false

# --- line 1: toolchain / project ------------------------------------------

[java]
symbol = ' '
version_format = '${raw}'
format = '[ $symbol$version ](fg:blue_bright bg:bg1)'

[package]
symbol = ' '
version_format = '${raw}'
format = '[ $symbol$version ](fg:blue_bright bg:bg1)'

[nodejs]
symbol = ' '
version_format = '${raw}'
format = '[ $symbol$version ](fg:blue_bright bg:bg1)'

[python]
symbol = ' '
version_format = '${raw}'
format = '[ $symbol$version ](fg:blue_bright bg:bg1)'
detect_extensions = []
detect_files = []
detect_folders = []

# --- line 1: Docker --------------------------------------------------------

[docker_context]
symbol = ' '
format = '[ $symbol$context ](fg:bg3 bg:bg1)'
only_with_files = false

# --- line 2: clock / duration / status ------------------------------------

[time]
disabled = false
time_format = '%H:%M'
format = '[  $time ](fg:fg0 bg:bg1)'

[cmd_duration]
min_time = 100
show_milliseconds = true
format = '[ $duration ](fg:fg0 bg:bg1)'

[status]
disabled = false
symbol = '✘ '
format = '[$symbol$status](fg:red bg:bg1)'
map_symbol = false
recognize_signal_code = true

# --- line 3 ---------------------------------------------------------------

[character]
success_symbol = '[❯](fg:green)'
error_symbol = '[❯](fg:red)'
format = '$symbol '
