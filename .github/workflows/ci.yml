name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh only checks a subset of the tree, so the gate here covers
      # everything: bashrc.d/lib/*.sh, completions and integration tests too.
      - name: bash -n over every shell file
        shell: bash
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) | sort)
          printf 'checking %d files\n' "${#files[@]}"
          status=0
          for file in "${files[@]}"; do
            bash -n "$file" || status=1
          done
          exit "$status"

  tests-linux:
    name: Linux / runner Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record environment
        shell: bash
        run: |
          bash --version | head -n 1
          uname -a
          ls --version | head -n 1
          awk -W version 2>&1 | head -n 1 || true
          ssh -V 2>&1 | head -n 1

      # The suite runs against throwaway home directories and stubbed ssh,
      # ssh-keygen and ssh-keyscan binaries. It opens no network connection.
      - name: Full test suite
        shell: bash
        run: bash tests/run-all.sh

      # bash-commands is an alias, and aliases are expanded when the -c string
      # is parsed, before bashrc.sh has defined it. Call the implementation.
      - name: bash-commands --check
        shell: bash
        run: |
          bash -ic '
            source bashrc.sh >/dev/null 2>&1
            bash_config_commands --check
          '

  bash-compat:
    name: Bash ${{ matrix.version }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.2.53
            image: bash:4.2.53-alpine3.22
          - version: 4.4.23
            image: bash:4.4.23-alpine3.22
          # Bash 5.1 introduced array-valued PROMPT_COMMAND, a specific branch
          # in prompt-core.sh that deserves its own compatibility boundary.
          - version: 5.1.16
            image: bash:5.1.16-alpine3.22
          - version: 5.3.20
            image: bash:5.3.20-alpine3.24
    steps:
      - uses: actions/checkout@v4

      # Official Bash images make the interpreter version explicit instead of
      # depending on whichever Bash happens to ship with the hosted runner.
      # Alpine packages add the GNU/OpenSSH tools required by the project.
      - name: Full suite under Bash ${{ matrix.version }}
        shell: bash
        env:
          BASH_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$BASH_IMAGE" bash -c '
              set -eu
              apk add --no-cache \
                coreutils findutils gawk git grep gzip \
                openssh-client-default sed tar >/dev/null
              bash --version | head -n 1
              bash tests/run-all.sh
            '

  legacy-remote:
    name: Remote fallback / Bash 3.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Local shells require Bash >=4.2, but prompt.sh intentionally supports
      # old remote hosts (notably stock macOS Bash 3.2) with a simpler prompt.
      - name: Exercise the pre-4.2 prompt path
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            bash:3.2.57-alpine3.22 bash -c '
              set -eu
              apk add --no-cache coreutils >/dev/null
              bash --version | head -n 1
              bash tests/integration/legacy-bash.sh
            '

  git-bash:
    name: Git Bash / Windows
    runs-on: windows-latest
    defaults:
      run:
        # On Windows, GitHub Actions maps `shell: bash` to the Bash bundled
        # with Git for Windows, which is exactly the supported MSYS2 target.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Record Git Bash environment
        run: |
          bash --version | head -n 1
          uname -a
          case $(uname -s) in
            MINGW*|MSYS*) ;;
            *) printf 'expected Git Bash/MSYS2, got %s\n' "$(uname -s)" >&2; exit 1 ;;
          esac
          git --version
          ssh -V 2>&1 | head -n 1

      - name: bash -n over every shell file
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) | sort)
          printf 'checking %d files\n' "${#files[@]}"
          status=0
          for file in "${files[@]}"; do
            bash -n "$file" || status=1
          done
          exit "$status"

      - name: Full test suite
        run: bash tests/run-all.sh

      - name: bash-commands --check
        run: |
          bash -ic '
            source bashrc.sh >/dev/null 2>&1
            bash_config_commands --check
          '

  prompt-integrations:
    name: Real prompt integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this pinned: compatibility should only move when we deliberately
      # update the supported upstream version.
      - name: Check out bash-git-prompt 2.7.1
        uses: actions/checkout@v4
        with:
          repository: magicmonty/bash-git-prompt
          ref: 2.7.1
          path: .ci/bash-git-prompt
          persist-credentials: false

      # Pin both the installer and the binary version. The regular suite never
      # downloads tools; only this integration job needs network access.
      - name: Install Starship 1.26.0
        shell: bash
        run: |
          mkdir -p "$PWD/.ci/bin"
          export PATH="$PWD/.ci/bin:$PATH"
          curl -fsSL \
            https://raw.githubusercontent.com/starship/starship/v1.26.0/install/install.sh \
            -o "$RUNNER_TEMP/starship-install.sh"
          sh "$RUNNER_TEMP/starship-install.sh" \
            --yes --bin-dir "$PWD/.ci/bin" --version v1.26.0
          printf '%s\n' "$PWD/.ci/bin" >> "$GITHUB_PATH"

      - name: bash-git-prompt 2.7.1 integration
        shell: bash
        run: bash tests/integration/bash-git-prompt.sh .ci/bash-git-prompt

      - name: Starship 1.26.0 integration
        shell: bash
        run: bash tests/integration/starship.sh "$(command -v starship)" 1.26.0

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # The tree is clean, so any finding is a regression and fails the build.
      # Every suppression in the sources is a targeted "# shellcheck disable="
      # with the reason written above it; there is no blanket exclusion here.
      # --source-path=SCRIPTDIR lets the existing "# shellcheck source="
      # directives resolve through the "$__ssh_tools_dir/..." style prefixes.
      - name: Lint
        shell: bash
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) | sort)
          printf 'linting %d files\n' "${#files[@]}"
          shellcheck --shell=bash --external-sources --source-path=SCRIPTDIR "${files[@]}"
