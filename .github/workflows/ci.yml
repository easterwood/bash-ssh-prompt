name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh only checks a subset of the tree, so the gate here covers
      # everything: bashrc.d/lib/*.sh and bashrc.d/completions/*.bash included.
      - name: bash -n over every shell file
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) | sort)
          printf 'checking %d files\n' "${#files[@]}"
          status=0
          for file in "${files[@]}"; do
            bash -n "$file" || status=1
          done
          exit "$status"

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this pinned: the compatibility test should fail only when either
      # our wiring changes or we deliberately move the supported upstream.
      - name: Check out bash-git-prompt 2.7.1
        uses: actions/checkout@v4
        with:
          repository: magicmonty/bash-git-prompt
          ref: 2.7.1
          path: .ci/bash-git-prompt
          persist-credentials: false

      - name: Record the environment the report refers to
        run: |
          bash --version | head -n 1
          ls --version | head -n 1
          awk -W version 2>&1 | head -n 1 || true

      # The suite runs against throwaway home directories and stubbed ssh,
      # ssh-keygen and ssh-keyscan binaries. It opens no network connection.
      - name: tests/run-all.sh
        run: bash tests/run-all.sh

      - name: bash-git-prompt 2.7.1 integration
        run: bash tests/integration/bash-git-prompt.sh .ci/bash-git-prompt

      # bash-commands is an alias, and aliases are expanded when the -c string
      # is parsed, before bashrc.sh has defined it. The underlying function is
      # called instead; --check resolves every documented command and exits 1
      # if one of them is missing.
      - name: bash-commands --check
        run: |
          bash -ic '
            source bashrc.sh >/dev/null 2>&1
            bash_config_commands --check
          '

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # The tree is clean, so any finding is a regression and fails the build.
      # Every suppression in the sources is a targeted "# shellcheck disable="
      # with the reason written above it; there is no blanket exclusion here.
      # --source-path=SCRIPTDIR lets the existing "# shellcheck source="
      # directives resolve through the "$__ssh_tools_dir/..." style prefixes.
      - name: Lint
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) | sort)
          printf 'linting %d files\n' "${#files[@]}"
          shellcheck --shell=bash --external-sources --source-path=SCRIPTDIR "${files[@]}"
